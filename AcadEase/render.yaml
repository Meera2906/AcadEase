# Render blueprint for the AcadEase API.
#
#   Render dashboard → New → Blueprint → point at this repo.
#
# Only the API runs here. The React SPA is a static build and belongs on Vercel
# (see DEPLOYMENT.md) — deploying it here too would just be a slower CDN.
#
# Everything marked `sync: false` must be filled in from the Render dashboard;
# they are secrets and are deliberately not in the repository.
services:
  - type: web
    name: acadease-api
    runtime: node
    plan: free
    region: singapore # closest Render region to Tamil Nadu
    rootDir: AcadEase/apps/api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Cross-site cookies. The SPA is on vercel.app and the API on
      # onrender.com, so the refresh cookie is third-party and must be
      # SameSite=None; Secure or the browser drops it silently.
      - key: COOKIE_CROSS_SITE
        value: "true"

      # Comma-separated. Add your Vercel production URL here after the first
      # front-end deploy — CORS and the CSRF double-submit both depend on it.
      - key: CLIENT_URL
        sync: false
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"

      # MongoDB Atlas connection string. Atlas Network Access must allow
      # 0.0.0.0/0 — Render's free tier has no static outbound IP.
      - key: MONGO_URI
        sync: false

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CERT_HMAC_SECRET
        sync: false # must stay stable, or every issued certificate fails its HMAC check
      - key: DOC_KEY_PASSPHRASE
        sync: false # must stay stable, or no stored admission document can be decrypted

      # The RSA signing identity, pinned to the environment so a redeploy does
      # not silently mint a new keyring and invalidate every certificate ever
      # issued. Generate with: node scripts/export-keys.mjs --render
      - key: KEY_TNTEU_PRIVATE
        sync: false
      - key: KEY_TNTEU_PUBLIC
        sync: false

      - key: INSTITUTION_ID
        value: TNTEU_001
      - key: INSTITUTION_NAME
        value: Tamil Nadu Teachers Education University
      - key: TOTP_ISSUER
        value: AcadEase

      # Public URL of this service; used in emailed/SMS download links.
      - key: API_URL
        sync: false

      # Optional integrations — the app runs without them.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
